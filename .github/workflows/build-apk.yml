name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gradle Yetkisi Ver
        run: chmod +x ./web_mobile/android/gradlew

      - name: APK Derle (Debug)
        run: |
          cd web_mobile/android
          ./gradlew assembleDebug

      - name: APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GameLingo-APK
          path: web_mobile/android/app/build/outputs/apk/debug/app-debug.apk